name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@22.22.0
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Run lint
        run: pnpm lint
      - name: Run typecheck
        run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@22.22.0
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build package
        run: pnpm build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@22.22.0
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test

  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@22.22.0
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test packed package
        run: pnpm smoke
