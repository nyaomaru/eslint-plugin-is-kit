name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@22.22.0
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Run lint
        run: pnpm lint
      - name: Run typecheck
        run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@22.22.0
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build package
        run: pnpm build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@22.22.0
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test

  smoke:
    name: Compatibility (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Node 22 / ESLint 8 / TypeScript 5.7
            node-version: 22.13.0
            eslint-version: 8.57.1
            typescript-version: 5.7.3
          - label: Node 24 / ESLint 9 / TypeScript 6.0
            node-version: 24.0.0
            eslint-version: 9.39.5
            typescript-version: 6.0.3
          - label: Node 26 / ESLint 10 / TypeScript 6.0
            node-version: 26.0.0
            eslint-version: 10.9.1
            typescript-version: 6.0.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test packed package
        run: pnpm smoke
        env:
          SMOKE_ESLINT_VERSION: ${{ matrix.eslint-version }}
          SMOKE_TYPESCRIPT_VERSION: ${{ matrix.typescript-version }}
