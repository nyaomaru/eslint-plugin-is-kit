name: Bug report
description: Report incorrect ESLint behavior or TypeScript type inference.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Fill in what you know; partial reports are welcome.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem and what you were trying to do.
      placeholder: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: If possible, provide a small ESLint config and TypeScript sample that reproduces the issue.
      placeholder: |
        ```ts
        import isKit from 'eslint-plugin-is-kit';

        // Minimal code and configuration that reproduce the issue
        ```
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: Explain which diagnostic or type result you receive.
      placeholder: What happened?
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Explain which diagnostic or type result you expected.
      placeholder: What should have happened?
  - type: input
    id: plugin-version
    attributes:
      label: eslint-plugin-is-kit version
      description: Provide this if you know it.
      placeholder: 0.1.0

  - type: input
    id: eslint-version
    attributes:
      label: ESLint version
      description: Provide this if you know it.
      placeholder: 10.9.1

  - type: input
    id: typescript-version
    attributes:
      label: TypeScript version
      description: Leave this blank if the issue is unrelated to TypeScript types.
      placeholder: 6.0.3

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Leave this blank if the issue is unrelated to Node.js.
      placeholder: 22.22.0

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other relevant information, such as your package manager, operating system, or screenshots.
