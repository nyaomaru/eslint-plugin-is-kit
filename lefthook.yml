# Refer for explanation to following link:
# https://lefthook.dev/configuration/

pre-commit:
  parallel: true
  jobs:
    - run: pnpm exec oxfmt {staged_files}
      glob: "*.{js,jsx,ts,tsx,json,md,yml,yaml}"
      stage_fixed: true
    - run: pnpm exec oxlint --fix {staged_files}
      glob: "*.{js,jsx,ts,tsx}"
      stage_fixed: true
